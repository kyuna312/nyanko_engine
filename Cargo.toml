[package]
name = "nyanko_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
glutin = { version = "0.30", features = ["wayland", "x11", "egl"] }
gl = "0.14"
winit = "0.27"
raw-window-handle = "0.5"
cgmath = "0.18"
image = "0.24"
log = "0.4"
env_logger = "0.10"
glam = "0.24"
rand = "0.8"
parking_lot = "0.12"
core-graphics = "0.22"
bytemuck = { version = "1.13", features = ["derive"] }

[build-dependencies]
shaderc = "0.8"

[features]
default = []

[[bin]]
name = "nyanko_engine"
path = "src/main.rs"

[[example]]
name = "basic_window"
path = "examples/basic/window.rs"

[[example]]
name = "basic_graphics"
path = "examples/basic/graphics.rs"

[[example]]
name = "basic_input"
path = "examples/basic/input.rs"

[dev-dependencies]
criterion = "0.5"
